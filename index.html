<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wrestling Weekly</title>
    <meta name="description" content="A never-ending, AI-booked wrestling TV show in ASCII." />
  </head>
  <body>
    <header id="hud">
      <span id="show" class="brand"></span>
      <span id="ep"></span>
      <span id="seg"></span>
      <span id="champs"></span>
    </header>
    <main>
      <section id="arena">
        <pre id="map" aria-label="Arena"></pre>
        <ul id="legend" aria-label="On screen"></ul>
      </section>
      <ul id="feed" aria-live="polite" aria-label="Play-by-play"></ul>
    </main>
    <footer>
      <span id="status"></span>
      <span class="keys"><kbd>space</kbd> pause <kbd>1</kbd>–<kbd>4</kbd> speed <kbd>d</kbd> debug <kbd>f</kbd> fullscreen <kbd>N</kbd> new world</span>
    </footer>
    <aside id="debug" hidden><pre id="debug-body"></pre></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
